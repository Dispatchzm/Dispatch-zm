<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>List Your Truck | Dispatch</title><style>
:root{--bg:#0a1320;--gold:#f0b64b;--text:#f2f5f9;--mut:#9fb0c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(1000px 500px at 85% -10%,#1d3558 0%,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;position:sticky;top:0;z-index:5;background:rgba(10,19,32,.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.brand{font-weight:900;letter-spacing:4px;font-size:18px}.brand i{color:var(--gold);font-style:normal}
.back{color:var(--text);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:10px 16px;border:1px solid rgba(255,255,255,.2);border-radius:999px}
.wrap{max-width:640px;margin:0 auto;padding:40px 5% 20px}
.pill{display:inline-block;color:var(--gold);background:rgba(240,182,75,.1);border:1px solid rgba(240,182,75,.3);padding:7px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-1.5px;margin:20px 0 10px}h1 span{background:linear-gradient(90deg,#f0b64b,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 26px;line-height:1.7}
.card{background:rgba(14,26,44,.82);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;display:grid;gap:14px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
input{display:block;width:100%;margin-top:6px;background:#0e1b2e;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:13px 14px;font:inherit;font-size:15px}input:focus{outline:2px solid var(--gold)}
.btn{display:block;text-align:center;text-decoration:none;background:#25d366;color:#08331b;padding:15px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
.err{color:#ff8a8a;font-size:13px;margin:0;min-height:18px}.note{color:#6f8097;font-size:12px;line-height:1.6;margin:0}
footer{margin-top:40px;padding:26px 6%;text-align:center;color:#6f8097;font-size:12px;border-top:1px solid rgba(255,255,255,.07)}
</style></head><body>
<div class="bar"><div class="brand">DISPATCH<i>.</i></div><a class="back" href="truck-sourcing.html" target="_blank" rel="noopener">&larr; Truck options</a></div>
<div class="wrap"><span class="pill">Truck Sourcing</span><h1>List <span>your truck</span></h1><p class="sub">Fill in your details and tap send. Everything goes to Dispatch on WhatsApp.</p>
<div class="card" id="f"></div></div>
<footer>© 2026 DISPATCH. All rights reserved.</footer>
<script>
var WA="260958167213",F=[["make","Make of truck","e.g. Howo, Scania, Faw"],["name","Driver name",""],["co","Company or independent","Company name, or write Independent driver"],["nrc","NRC number",""],["pp","Passport number","Foreign drivers"],["lic","License number",""],["truck","Truck number plate",""],["trl","Trailer number plate","Write none if no trailer"],["to","Where the truck wants to go",""],["pay","Required payment","e.g. K20,000"]];
var c=document.getElementById("f");
c.innerHTML=F.map(function(f){return '<label>'+f[1]+'<input id="f_'+f[0]+'" autocomplete="off" placeholder="'+f[2]+'"></label>'}).join("")+'<p class="err" id="err"></p><a class="btn" id="send" href="#" target="_blank" rel="noopener">Send on WhatsApp</a><p class="note">Your details are sent only to Dispatch on WhatsApp.</p>';
function v(i){return document.getElementById("f_"+i).value.trim()}
var a=document.getElementById("send"),er=document.getElementById("err");
function build(){var m="TRUCK LISTING\n\nMake of truck: "+v("make")+"\nDriver name: "+v("name")+"\nCompany: "+(v("co")||"Independent driver")+"\nNRC: "+(v("nrc")||"-")+"\nPassport: "+(v("pp")||"-")+"\nLicense no: "+v("lic")+"\nTruck plate: "+v("truck")+"\nTrailer plate: "+(v("trl")||"None")+"\nGoing to: "+v("to")+"\nRequired payment: "+v("pay");a.href="https://wa.me/"+WA+"?text="+encodeURIComponent(m)}
F.forEach(function(f){document.getElementById("f_"+f[0]).addEventListener("input",build)});build();
a.addEventListener("click",function(e){var m=[];if(!v("make"))m.push("make of truck");if(!v("name"))m.push("driver name");if(!v("nrc")&&!v("pp"))m.push("NRC or passport");if(!v("lic"))m.push("license number");if(!v("truck"))m.push("truck plate");if(!v("to"))m.push("where the truck wants to go");if(!v("pay"))m.push("required payment");if(m.length){e.preventDefault();er.textContent="Please fill in: "+m.join(", ")+"."}else er.textContent=""});
</script></body></html>
